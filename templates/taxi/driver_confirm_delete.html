{% extends "base.html" %}

{% block content %}
  <h2>Delete Driver</h2>
  <p>Are you sure you want to delete "{{ driver.username }}"?</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-group d-flex">
      <input type="submit" value="Confirm Delete" class="btn btn-danger">
      <a href="{% url 'taxi:driver-list' %}" class="btn btn-secondary ml-2">Cancel</a>
    </div>
  </form>
{% endblock %}
